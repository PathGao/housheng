name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android 构建、测试与权限检查
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: 获取源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 配置 Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - name: 配置 Gradle 缓存并校验 Wrapper
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - name: 安装 Android 35 工具链
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: 单元测试、静态检查与全部构建
        run: >-
          ./gradlew --no-daemon --console=plain
          :app:testOfflineDebugUnitTest :app:testOnlineDebugUnitTest
          :app:lintOnlineDebug :app:lintOfflineRelease :fixture:lintDebug
          :app:assembleDebug :fixture:assembleDebug
          :app:assembleOfflineDebugAndroidTest :app:assembleOnlineDebugAndroidTest :fixture:assembleDebugAndroidTest
          :app:assembleRelease
      - name: 确认不联网版无权限、联网版只有网络权限
        run: >-
          scripts/check-permissions.sh "$ANDROID_HOME/build-tools/35.0.0/aapt2"
          app/build/outputs/apk/offline/release/app-offline-release-unsigned.apk
          app/build/outputs/apk/online/release/app-online-release-unsigned.apk
      - name: 保存家庭试用安装包
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: housheng-debug-apks
          path: |
            app/build/outputs/apk/offline/debug/app-offline-debug.apk
            app/build/outputs/apk/online/debug/app-online-debug.apk
            fixture/build/outputs/apk/debug/fixture-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: 保存检查报告
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-reports
          path: |
            app/build/reports/
            app/build/test-results/
            fixture/build/reports/
          retention-days: 14

  protocol:
    name: 模型协议与统计检查
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 获取源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 配置 Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: 运行无模型依赖的协议与指标测试
        run: python -m unittest discover -s validation/clef -p 'test_*.py' -v
      - name: 检查 Shell 入口语法
        run: for f in scripts/*.sh; do sh -n "$f"; done
